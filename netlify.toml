[build]
  command = "cd app/applet && npm install && npm run build"
  publish = "app/applet/dist"

[[redirects]]
  from = "/api/river-gauge"
  to = "https://dd.weather.gc.ca/today/hydrometric/csv/NL/hourly/NL_02ZD002_hourly_hydrometric.csv"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
